<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111927" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ff007a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-team { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: 6px; fill: #00f2fe; text-transform: uppercase; font-size: 14px; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; fill: #ffffff; font-size: 42px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; letter-spacing: 0.5px; fill: #94a3b8; font-size: 16px; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Futuristic Geometric Circuit Elements -->
  <g opacity="0.6">
    <path d="M 900 40 L 1140 40 L 1170 70 L 1170 290 L 1130 330 L 950 330" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="900" cy="40" r="3" fill="#00f2fe" />
    <circle cx="1170" cy="70" r="3" fill="#ff007a" />
    <circle cx="950" cy="330" r="3" fill="#4facfe" />
  </g>

  <!-- Racing Track Neon Curves (Representing High-Speed Line Follower) -->
  <path d="M -50 320 Q 250 340 400 240 T 750 180 T 1000 120 T 1250 80" fill="none" stroke="url(#trackGrad)" stroke-width="7" filter="url(#glowStrong)" />
  <path d="M -50 320 Q 250 340 400 240 T 750 180 T 1000 120 T 1250 80" fill="none" stroke="#ffffff" stroke-width="2.5" />

  <!-- Sensor Optical Rays & Robot Node Representation -->
  <g transform="translate(680, 160)" filter="url(#glowCyan)">
    <!-- Robot center node -->
    <rect x="-35" y="-22" width="70" height="44" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="700">ESP32-S3</text>
    
    <!-- 8 IR Sensors Array Simulation -->
    <g transform="translate(42, -18)">
      <line x1="0" y1="0" x2="15" y2="-10" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
      <line x1="0" y1="5" x2="18" y2="-3" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
      <line x1="0" y1="10" x2="20" y2="4" stroke="#ff007a" stroke-width="2" />
      <line x1="0" y1="15" x2="22" y2="11" stroke="#ff007a" stroke-width="2" />
      <line x1="0" y1="21" x2="20" y2="18" stroke="#ff007a" stroke-width="2" />
      <line x1="0" y1="26" x2="18" y2="25" stroke="#ff007a" stroke-width="2" />
      <line x1="0" y1="31" x2="15" y2="32" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
      <line x1="0" y1="36" x2="12" y2="39" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Wheel vectors -->
    <rect x="-26" y="-30" width="16" height="6" rx="2" fill="#475569" stroke="#94a3b8" />
    <rect x="-26" y="24" width="16" height="6" rx="2" fill="#475569" stroke="#94a3b8" />
  </g>

  <!-- Left Content: Branding and Titles -->
  <g transform="translate(70, 75)">
    <!-- Subtitle / Badge -->
    <g>
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" />
      <circle cx="12" cy="13" r="4" fill="#00f2fe" filter="url(#glowCyan)" />
      <text x="26" y="17" class="title-team">LINE FOLLOWER PRO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" class="title-main">ROBOT RACE ON LINE</text>
    <text x="0" y="105" class="title-sub">Высокоскоростной робот для соревнований по регламенту «Гонки по линии»</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: ESP32-S3 -->
      <g transform="translate(0, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <circle cx="18" cy="17" r="4" fill="#38bdf8" />
        <text x="32" y="21" class="badge-text">ESP32-S3</text>
      </g>

      <!-- Badge 2: QTR-8RC -->
      <g transform="translate(125, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <circle cx="18" cy="17" r="4" fill="#ec4899" />
        <text x="32" y="21" class="badge-text">QTR-8RC</text>
      </g>

      <!-- Badge 3: 1500 RPM -->
      <g transform="translate(250, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <circle cx="18" cy="17" r="4" fill="#eab308" />
        <text x="32" y="21" class="badge-text">1500 RPM N20</text>
      </g>

      <!-- Badge 4: TB6612FNG -->
      <g transform="translate(390, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <circle cx="18" cy="17" r="4" fill="#a855f7" />
        <text x="32" y="21" class="badge-text">TB6612FNG</text>
      </g>

      <!-- Badge 5: 3D Chassis -->
      <g transform="translate(530, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <circle cx="18" cy="17" r="4" fill="#10b981" />
        <text x="32" y="21" class="badge-text">3D PRINTED</text>
      </g>
    </g>

    <!-- Key Metrics Strip -->
    <g transform="translate(0, 205)">
      <line x1="0" y1="0" x2="655" y2="0" stroke="#334155" stroke-opacity="0.6" />
      
      <g transform="translate(0, 18)">
        <text x="0" y="0" class="metric-title">PWM Частота</text>
        <text x="0" y="22" class="metric-val">20 kHz <tspan font-size="12" fill="#64748b">Silent</tspan></text>
      </g>

      <g transform="translate(150, 18)">
        <text x="0" y="0" class="metric-title">Алгоритм</text>
        <text x="0" y="22" class="metric-val">PID + Anti-Windup</text>
      </g>

      <g transform="translate(360, 18)">
        <text x="0" y="0" class="metric-title">Калибровка</text>
        <text x="0" y="22" class="metric-val">Auto-Swing 3s</text>
      </g>

      <g transform="translate(520, 18)">
        <text x="0" y="0" class="metric-title">Сенсоры</text>
        <text x="0" y="22" class="metric-val">8× IR Analog/RC</text>
      </g>
    </g>
  </g>
</svg>
